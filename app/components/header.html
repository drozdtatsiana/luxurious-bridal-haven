<header class="header">
  <div class="container">
    <div class="header__inner">
      <button class="header__btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
        <svg width="30" height="19" aria-hidden="true" focusable="false">
          <use href="images/sprite.svg#mobile-btn"></use>
        </svg>
      </button>
      <div class="header__logo">
        <a class="logo" href="index.html" aria-label="Luxurious Bridal Haven, home page">
          <img class="logo__img" src="images/logo.svg" width="245" height="52" alt="">
        </a>
      </div>
      <nav class="menu" id="menu" aria-label="Main menu">
        <ul class="header__lang">
          <li class="header__lang-item">
            <a href="#" class="header__lang-link header__lang-link--active" lang="en" aria-current="true">EN</a>
          </li>
          <li class="header__lang-item">
            <a href="#" class="header__lang-link" lang="uk">UA</a>
          </li>
        </ul>
        <ul class="menu__list">
          <li class="menu__item"><a href="catalog.html" class="menu__link">CATALOG</a></li>
          <li class="menu__item"><a href="collection.html" class="menu__link">COLLECTIONS</a></li>
          <li class="menu__item"><a href="blog.html" class="menu__link">BLOG</a></li>
          <li class="menu__item"><a href="reviews.html" class="menu__link">REVIEWS</a></li>
          <li class="menu__item"><a href="appointment.html" class="menu__link">BOOK AN APPOINTMENT</a></li>
          <li class="menu__item"><a href="#contact" class="menu__link">CONTACT</a></li>
        </ul>
      </nav>
      <ul class="header__actions">
        <li class="header__actions-item">
          <a href="#" class="header__actions-link" aria-label="Open user menu">
            <svg width="24" height="24" aria-hidden="true" focusable="false">
              <use href="images/sprite.svg#user"></use>
            </svg>
          </a>
        </li>
        <li class="header__actions-item">
          <a href="#" class="header__actions-link" aria-label="Go to wishlist">
            <svg width="24" height="22" aria-hidden="true" focusable="false">
              <use href="images/sprite.svg#wishlist"></use>
            </svg>
          </a>
        </li>
        <li class="header__actions-item">
          <button class="header__actions-link open-modal" type="button" aria-label="Open shopping bag" aria-haspopup="dialog">
            <svg width="24" height="24" aria-hidden="true" focusable="false">
              <use href="images/sprite.svg#shopping-bag"></use>
            </svg>
          </button>
        </li>
      </ul>
    </div>
  </div>
</header>

<div class="modal" aria-hidden="true">
  <div class="modal__overlay"></div>
  <div class="modal__content" role="dialog" aria-modal="true" aria-label="Shopping bag">
    <div class="checkout__details-items">
      <div class="checkout__details-itemsline">
        <p class="checkout__details-quantity">2 items in bag</p>
        <button class="checkout__details-del close-modal" type="button" aria-label="Close shopping bag">
          <svg width="18" height="18" aria-hidden="true" focusable="false">
            <use href="images/sprite.svg#checkout-del"></use>
          </svg>
        </button>
      </div>
      <div class="checkout__item">
        <picture>
          <source srcset="images/order-1.avif" type="image/avif">
          <source srcset="images/order-1.webp" type="image/webp">
          <img class="checkout__item-img" src="images/order-1.jpg" alt="Naomi wedding dress">
        </picture>
        <div class="checkout__item-box">
          <p class="checkout__item-title">NAOMI</p>
          <dl class="checkout__item-list">
            <div class="checkout__item-listbox">
              <dt class="checkout__item-term">SIZE:</dt>
              <dd class="checkout__item-difinition">S</dd>
            </div>
            <div class="checkout__item-listbox">
              <dt class="checkout__item-term">COLOR:</dt>
              <dd class="checkout__item-difinition">IVORY</dd>
            </div>
            <div class="checkout__item-listbox">
              <dt class="checkout__item-term">Item subtotal:</dt>
              <dd class="checkout__item-difinition">€ 2,600</dd>
            </div>
          </dl>
          <button class="checkout__item-del" type="button" aria-label="Remove Naomi from bag">
            <svg width="16" height="20" aria-hidden="true" focusable="false">
              <use href="images/sprite.svg#item-del"></use>
            </svg>
          </button>
        </div>
      </div>
      <div class="checkout__item">
        <picture>
          <source srcset="images/order-2.avif" type="image/avif">
          <source srcset="images/order-2.webp" type="image/webp">
          <img class="checkout__item-img" src="images/order-2.jpg" alt="Sabine bridal shoes">
        </picture>
        <div class="checkout__item-box">
          <p class="checkout__item-title">SABINE</p>
          <dl class="checkout__item-list">
            <div class="checkout__item-listbox">
              <dt class="checkout__item-term">SIZE:</dt>
              <dd class="checkout__item-difinition">38</dd>
            </div>
            <div class="checkout__item-listbox">
              <dt class="checkout__item-term">COLOR:</dt>
              <dd class="checkout__item-difinition">IVORY</dd>
            </div>
            <div class="checkout__item-listbox">
              <dt class="checkout__item-term">Item subtotal:</dt>
              <dd class="checkout__item-difinition">€ 200</dd>
            </div>
          </dl>
          <button class="checkout__item-del" type="button" aria-label="Remove Sabine from bag">
            <svg width="16" height="20" aria-hidden="true" focusable="false">
              <use href="images/sprite.svg#item-del"></use>
            </svg>
          </button>
        </div>
      </div>
    </div>
    <div class="order">
      <dl class="order__list">
        <div class="order__list-box">
          <dt class="order__list-term">Subtotal:</dt>
          <dd class="order__list-difinition">€ 2,800</dd>
        </div>
        <div class="order__list-box">
          <dt class="order__list-term">Shipping:</dt>
          <dd class="order__list-difinition">FREE</dd>
        </div>
        <div class="order__list-box">
          <dt class="order__list-term">Total:</dt>
          <dd class="order__list-difinition">€ 2,800</dd>
        </div>
      </dl>
      <div class="order__links">
        <a class="order__link" href="catalog.html">KEEP SHOPPING</a>
        <a class="order__link-now" href="checkout.html">BUY IT NOW</a>
      </div>
    </div>
  </div>
</div>
