<section class="join-us" id="join-us">
    <div class="container">
        <div class="join-us__inner">
            <picture class="join-us__img">
                <source srcset="images/join-img.avif" type="image/avif">
                <source srcset="images/join-img.webp" type="image/webp">
                <img src="images/join-img.jpg" width="540" height="489" loading="lazy" alt="White A-line wedding dress with long puffy tulle sleeves and sequin embellishments">
            </picture>
            <div class="join-us__box">
                <h2 class="join-us__title">JOIN US</h2>
                <p class="join-us__text">Sign up and get 10% discount on your first purchase!</p>
                <form action="#" class="join-us__form">
                    <label class="visually-hidden" for="userName">Enter your first name</label>
                    <input class="join-us__input" type="text" name="name" id="userName" placeholder="First Name" autocomplete="given-name" required>
                    <label class="visually-hidden" for="userEmail">Enter your email</label>
                    <input class="join-us__input" type="email" name="email" id="userEmail" placeholder="Email" autocomplete="email" required>
                    <button class="join-us__btn" type="submit">GET 10%</button>
                    <p class="join-us__form-caption">
                        *By completing this form you are signing up to receive our emails and can unsubscribe at any time.
                    </p>
                </form>
            </div>
        </div>
    </div>
</section>
