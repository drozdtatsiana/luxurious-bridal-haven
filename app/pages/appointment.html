<main class="main">
    <section class="appointment">
        <div class="container">
            <h1 class="appointment__title">BOOK AN APPOINTMENT</h1>
            <div class="appointment__box">
                <form action="#" class="appointment__form">
                    <p class="appointment__form-title">CONTACT INFORMATION</p>
                    <p class="appointment__form-text">Fill in your contact
                        details</p>
                    <label class="visually-hidden" for="userName">First
                        name</label>
                    <input class="appointment__input" type="text" name="name"
                        id="userName" placeholder="First name"
                        autocomplete="given-name" required>
                    <label class="visually-hidden" for="userLastName">Last
                        name</label>
                    <input class="appointment__input" type="text"
                        name="lastName" id="userLastName"
                        placeholder="Last name" autocomplete="family-name"
                        required>
                    <label class="visually-hidden" for="userEmail">Email</label>
                    <input class="appointment__input" type="email" name="email"
                        id="userEmail" placeholder="Email" autocomplete="email"
                        required>
                    <label class="visually-hidden" for="userTel">Mobile</label>
                    <input class="appointment__input" type="tel" name="tel"
                        id="userTel" placeholder="Mobile" autocomplete="tel"
                        required>
                    <button class="appointment__btn" type="submit">SEND</button>
                </form>
                <picture class="appointment__image">
                    <source srcset="images/appointment.avif" type="image/avif">
                    <source srcset="images/appointment.webp" type="image/webp">
                    <img src="images/appointment.jpg" width="540" height="690"
                        alt="Luxurious bridal gown with statement sleeves from the new collection">
                </picture>
            </div>
        </div>
    </section>
</main>
